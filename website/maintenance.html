<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Back shortly · Mail AI</title>
  <meta name="description" content="Mail AI's website is down for a short update." />
  <meta name="theme-color" content="#f4f1ea" />
  <link rel="icon" type="image/svg+xml" href="brand/logos/mailai-mark.svg" />
  <script>try { if (localStorage.getItem('mailai-theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}</script>
  <link rel="stylesheet" href="site.css" />
  <script src="theme.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <span class="lockup">
        <img class="for-light" src="brand/logos/mailai-lockup.svg" alt="Mail AI" width="98" height="32" />
        <img class="for-dark" src="brand/logos/mailai-lockup-reversed.svg" alt="Mail AI" width="98" height="32" />
      </span>
    </div>
  </header>
  <main class="wrap">
    <article class="doc">
      <h1 class="title">Back shortly</h1>
      <p class="lede">The website is down for a short update. Questions: <a href="mailto:hello@mailai.uk">hello@mailai.uk</a>.</p>
    </article>
  </main>
</body>
</html>
