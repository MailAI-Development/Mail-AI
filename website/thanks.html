<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Downloading · Mail AI</title>
  <meta name="description" content="Your Mail AI desktop download." />
  <meta name="theme-color" content="#f4f1ea" />
  <link rel="icon" type="image/svg+xml" href="brand/logos/mailai-mark.svg" />
  <script>try { if (localStorage.getItem('mailai-theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}</script>
  <link rel="stylesheet" href="site.css" />
  <script src="theme.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a href="/" class="lockup" aria-label="Mail AI home">
        <img class="for-light" src="brand/logos/mailai-lockup.svg" alt="Mail AI" width="98" height="32" />
        <img class="for-dark" src="brand/logos/mailai-lockup-reversed.svg" alt="Mail AI" width="98" height="32" />
      </a>
      <nav aria-label="Main">
        <a href="/#how">How it works</a>
        <a href="/#pricing">Pricing</a>
        <a href="privacy.html">Privacy</a>
      </nav>
      <div class="actions">
        <button class="icon-btn theme-toggle" type="button" aria-label="Switch theme"></button>
        <a class="signin" href="/app/">Sign in</a>
        <a class="btn primary small" href="/app/">Start free trial</a>
      </div>
    </div>
  </header>

  <main class="wrap">
    <article class="doc">
      <h1 class="title">Your download is starting</h1>
      <p class="lede">If nothing happens in a few seconds, <a href="https://github.com/MailAI-Development/Mail-AI/releases/latest">download it from the releases page</a>. Check your browser's downloads, usually at the top right.</p>
      <p><a class="btn" href="download.html">Back to the desktop app</a></p>
    </article>
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <a href="/" class="lockup" aria-label="Mail AI home">
        <img class="for-light" src="brand/logos/mailai-lockup.svg" alt="Mail AI" width="74" height="24" />
        <img class="for-dark" src="brand/logos/mailai-lockup-reversed.svg" alt="Mail AI" width="74" height="24" />
      </a>
      <nav aria-label="Footer">
        <a href="/#pricing">Pricing</a>
        <a href="privacy.html">Privacy</a>
        <a href="terms.html">Terms</a>
        <a href="mailto:hello@mailai.uk">hello@mailai.uk</a>
      </nav>
      <span class="copy">© 2026 Mail AI</span>
    </div>
  </footer>
  <script>
    function triggerDownload(url) {
      var a = document.createElement('a');
      a.href = url; a.download = '';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }
    window.addEventListener('load', async function () {
      // Find the .exe on the latest GitHub release (asset names include the version, so a fixed URL would 404).
      var fallback = 'https://github.com/MailAI-Development/Mail-AI/releases/latest';
      try {
        var r = await fetch('https://api.github.com/repos/MailAI-Development/Mail-AI/releases/latest', { headers: { 'Accept': 'application/vnd.github+json' } });
        if (r.ok) {
          var j = await r.json();
          var exe = (j.assets || []).find(function (a) { return (a.name || '').toLowerCase().endsWith('.exe'); });
          if (exe) { triggerDownload(exe.browser_download_url); return; }
        }
      } catch (e) { /* fall through */ }
      window.location.href = fallback;
    });
  </script>
</body>
</html>
